<!DOCTYPE html>
<html lang="it">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
        <title>JstABlog - Dashboard</title>
    </head>
    <body data-bs-theme="dark" class="bg-dark text-light vh-100">
        <div class="container-fluid p-4 h-100 d-flex flex-column">

            <div class="row mb-4">
                <div class="col-12">
                    <small class="text-info fw-bold">POST MANAGEMENT CONSOLE</small>
                    <h1 class="display-6 mt-2">Dashboard</h1>
                </div>
            </div>

            <div class="row g-3 flex-grow-1 mb-4">

                <div class="col-12 col-lg-3">
                    <div class="card h-100 border-0 bg-secondary bg-opacity-10">
                        <div class="card-body d-flex flex-column">
                            <h5 class="card-title text-light mb-3">Posts' Archive</h5>
                            <div class="mb-3">
                                <button class="btn btn-outline-light w-100" type="button">Reload List</button>
                            </div>

                            <div class="list-group list-group-flush flex-grow-1 overflow-auto pe-2">
                                <a href="#" class="list-group-item list-group-item-action active border-0 rounded mb-1">
                                    <div class="fw-bold">Esempio di Titolo</div>
                                    <small class="text-light text-opacity-75">12/03/2026</small>
                                </a>
                                <a href="#" class="list-group-item list-group-item-action border-0 rounded mb-1 bg-transparent">
                                    <div class="fw-bold">Altro Post</div>
                                    <small class="text-secondary">01/02/2026</small>
                                </a>
                            </div>

                            <div class="mt-3 small text-success">Pronto</div>
                        </div>
                    </div>
                </div>

                <div class="col-12 col-lg-6">
                    <div class="card h-100 border-0 bg-secondary bg-opacity-10">
                        <div class="card-body d-flex flex-column">
                            <h5 class="card-title text-light mb-3">Editor</h5>

                            <label class="form-label text-secondary small mb-1 fw-bold">TITLE</label>
                            <input class="form-control mb-3 fs-5 fw-semibold" type="text" placeholder="Titolo dell'articolo">

                            <label class="form-label text-secondary small mb-1 fw-bold">BODY</label>
                            <textarea class="form-control flex-grow-1 mb-3" placeholder="Contenuto..."></textarea>

                            <div class="d-flex justify-content-between mt-2">
                                <button class="btn btn-outline-primary px-4">NEW</button>
                                <button class="btn btn-info fw-bold text-dark px-4">SAVE</button>
                                <button class="btn btn-danger fw-bold px-4">DELETE</button>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="col-12 col-lg-3">
                    <div class="card h-100 border-0 bg-secondary bg-opacity-10">
                        <div class="card-body d-flex flex-column">
                            <h5 class="card-title text-light mb-3">Search - Filter</h5>

                            <label class="form-label text-secondary small mb-1 fw-bold">SEARCH BY TITLE</label>
                            <div class="input-group mb-3">
                                <input type="text" class="form-control" placeholder="Titolo">
                                <button class="btn btn-info text-dark fw-bold" type="button">Cerca</button>
                            </div>

                            <hr class="border-secondary opacity-50">

                            <label class="form-label text-secondary small mb-1 fw-bold">DATA FILTER</label>
                            <input type="date" class="form-control mb-2">
                            <button class="btn btn-outline-light mb-4 w-100">Apply Data Filter</button>

                            <label class="form-label text-secondary small mb-1 fw-bold">TIME RANGE</label>
                            <input type="date" class="form-control mb-2">
                            <input type="date" class="form-control mb-3">
                            <button class="btn btn-info fw-bold text-dark w-100 mt-auto">Search by time</button>
                        </div>
                    </div>
                </div>

            </div>

            <footer class="mt-auto py-3 border-top border-secondary border-opacity-25">
                <div class="d-flex flex-column flex-md-row justify-content-between align-items-center">
                    <span class="text-secondary small">&copy; 2026 JstABlog Console. Made by JstRev - ENDRI.</span>
                    <ul class="nav">
                        <li class="nav-item">
                            <a href="https://github.com/JstRev" class="nav-link px-2 text-secondary small">JstRev</a>
                        </li>
                        <li class="nav-item">
                            <a href="https://github.com/JstRev/JstABlog" class="nav-link px-2 text-secondary small">Github Repo</a>
                        </li>
                    </ul>
                </div>
            </footer>

        </div>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    </body>
</html>
