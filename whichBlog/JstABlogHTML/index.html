<!DOCTYPE html>
    <html lang="it">\
        <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
        <link rel="stylesheet" href="style.css">
        <title>JstABlog - Dashboard</title>
        </head>
        <body class="app-bg text-main">
        <div class="container-fluid p-4">
            <div class="row mb-4">
            <div class="col-12">
                <small class="text-primary-accent fw-bold">POST MANAGEMENT CONSOLE</small>
                <h1 class="display-6 mt-2">Dashboard</h1>
            </div>
            </div>

            <div class="row g-3">
            <!-- Left column: Posts' Archive -->
            <div class="col-12 col-lg-3">
                <div class="card card-custom h-100">
                <div class="card-body d-flex flex-column">
                    <h5 class="card-title text-main mb-3">Posts' Archive</h5>
                    <div class="mb-3">
                    <button class="btn btn-secondary-custom w-100" type="button">Reload List</button>
                    </div>

                    <div class="list-group list-group-flush flex-grow-1 overflow-auto posts-list">
                    <a href="#" class="list-group-item list-group-item-action list-item-custom active">
                        <div class="fw-bold">Esempio di Titolo</div>
                        <small class="text-muted">12/03/2026</small>
                    </a>
                    <a href="#" class="list-group-item list-group-item-action list-item-custom">
                        <div class="fw-bold">Altro Post</div>
                        <small class="text-muted">01/02/2026</small>
                    </a>
                    <!-- ... other items ... -->
                    </div>

                    <div class="mt-3 small text-success status-msg">Pronto</div>
                </div>
                </div>
            </div>

            <!-- Middle column: Editor -->
            <div class="col-12 col-lg-6">
                <div class="card card-custom h-100">
                <div class="card-body d-flex flex-column">
                    <h5 class="card-title text-main mb-3">Editor</h5>

                    <label class="form-label text-muted small mb-1">TITLE</label>
                    <input class="form-control form-control-dark mb-3 title-input" type="text" placeholder="Titolo dell'articolo">

                    <label class="form-label text-muted small mb-1">BODY</label>
                    <textarea class="form-control form-control-dark flex-grow-1 mb-3" rows="10" placeholder="Contenuto..."></textarea>

                    <div class="d-flex justify-content-between mt-2 buttons-row">
                    <button class="btn btn-secondary-outline">NEW</button>
                    <button class="btn btn-primary-custom">SAVE</button>
                    <button class="btn btn-danger-custom">DELETE</button>
                    </div>
                </div>
                </div>
            </div>

            <!-- Right column: Search / Filter -->
            <div class="col-12 col-lg-3">
                <div class="card card-custom h-100">
                <div class="card-body d-flex flex-column">
                    <h5 class="card-title text-main mb-3">Search - Filter</h5>

                    <label class="form-label text-muted small mb-1">SEARCH BY TITLE</label>
                    <div class="input-group mb-3">
                    <input type="text" class="form-control form-control-dark" placeholder="Titolo">
                    <button class="btn btn-primary-custom" type="button"></button>
                    </div>

                    <hr class="divider">

                    <label class="form-label text-muted small mb-1">DATA FILTER</label>
                    <input type="date" class="form-control form-control-dark mb-2">
                    <button class="btn btn-secondary-custom mb-3">Apply Data Filter</button>

                    <label class="form-label text-muted small mb-1">TIME RANGE</label>
                    <input type="date" class="form-control form-control-dark mb-2">
                    <input type="date" class="form-control form-control-dark mb-3">
                    <button class="btn btn-primary-custom w-100">Search by time</button>
                </div>
                </div>
            </div>

            </div>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
        </body>
</html>
